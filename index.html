<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jelenino Devojacko Galerija</title>

<style>
:root{
    --pink:#ff5fa2;
    --pink-light:#ffd7e8;
    --pink-bg:#fff7fb;
    --dark:#2b2b2b;
    --white:#ffffff;
    --shadow:0 20px 40px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Inter, Arial, sans-serif;
    background:linear-gradient(180deg,#fff,#fff7fb);
    color:var(--dark);
    min-height:100vh;
}

.hidden{
    display:none !important;
}

/* PASSWORD SCREEN */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:450px;
    background:white;
    padding:40px;
    border-radius:24px;
    box-shadow:var(--shadow);
    text-align:center;
}

.login-card h1{
    font-size:2rem;
    margin-bottom:10px;
}

.login-card p{
    color:#666;
    margin-bottom:24px;
}

.password-box{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.password-box input{
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:1rem;
}

.password-box button{
    padding:15px;
    border:none;
    border-radius:14px;
    background:var(--pink);
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:.2s;
}

.password-box button:hover{
    opacity:.9;
}

#error{
    color:#d81b60;
    margin-top:12px;
}

/* GALLERY */

header{
    padding:40px 20px;
    text-align:center;
}

header h1{
    font-size:2.4rem;
    margin-bottom:10px;
}

header p{
    color:#777;
}

.gallery{
    columns:4 280px;
    column-gap:18px;
    padding:20px;
    max-width:1600px;
    margin:auto;
}

.card{
    break-inside:avoid;
    margin-bottom:18px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:100%;
    display:block;
    cursor:pointer;
}

.card-footer{
    padding:14px;
}

.download-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    padding:12px;
    background:var(--pink);
    color:white;
    border-radius:12px;
    font-weight:600;
}

.download-btn:hover{
    opacity:.9;
}

/* LIGHTBOX */

#lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
}

#lightbox img{
    max-width:95vw;
    max-height:90vh;
    border-radius:12px;
}

.close{
    position:absolute;
    top:20px;
    right:25px;
    background:white;
    color:black;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:20px;
    font-weight:bold;
}

@media(max-width:768px){

    header h1{
        font-size:1.8rem;
    }

    .login-card{
        padding:30px;
    }
}
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->

<div id="loginScreen">

    <div class="login-card">
        <h1>Privatna Foto Galerija</h1>

        <p>
            Unesi sifru da pristupis fotografijama.
        </p>

        <div class="password-box">
            <input
                type="password"
                id="passwordInput"
                placeholder="Enter password"
                aria-label="Password"
            >

            <button onclick="checkPassword()">
                Otvori Galeriju
            </button>
        </div>

        <div id="error"></div>
    </div>

</div>

<!-- GALLERY -->

<div id="galleryContainer" class="hidden">

    <header>
        <h1>Jelenina Devojacka Proslava</h1>
        <p>Privatna kolekcija fotografija sa proslave devojackog</p>
        
<a href="#" class="download-btn" onclick="downloadAll(); return false;">
    Skini sve slike odjednom
</a>

    </header>

    <div class="gallery" id="gallery"></div>

</div>

<!-- LIGHTBOX -->


<div id="lightbox" class="hidden">
    <button class="close" onclick="closeLightbox()">×</button>
    <img id="lightboxImage" src="" alt="Preview">
</div>

    
</div>

<script>

/* PASSWORD */

const PASSWORD = "photoshoot2026";

function checkPassword(){

    const value = document
        .getElementById("passwordInput")
        .value;

    if(value === PASSWORD){

        localStorage.setItem("galleryAccess", "granted");

        document.getElementById("loginScreen")
            .classList.add("hidden");

        document.getElementById("galleryContainer")
            .classList.remove("hidden");

    }else{

        document.getElementById("error").innerText =
            "Incorrect password.";
    }
}

if(localStorage.getItem("galleryAccess")==="granted"){

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("galleryContainer")
        .classList.remove("hidden");
}

/*
ADD ALL IMAGE FILENAMES HERE

Example:
photo1.jpg
photo2.jpg
photo3.jpg

Upload them beside index.html
*/

const images = [
    "photo1.jpg",
    "photo2.jpg",
    "photo3.jpg",
    "photo4.jpg",
    "photo5.jpg",
    "photo6.jpg"
];

const gallery = document.getElementById("gallery");

images.forEach(file => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <img
            src="${file}"
            alt="Photo"
            tabindex="0"
        >

        <div class="card-footer">
            <a
                href="${file}"
                download
                class="download-btn"
            >
                Download Photo
            </a>
        </div>
    `;

    const image = card.querySelector("img");

    image.addEventListener("click", () => {
        openLightbox(file);
    });

    image.addEventListener("keydown", (e) => {
        if(e.key === "Enter"){
            openLightbox(file);
        }
    });

    gallery.appendChild(card);
});
    
function openLightbox(src){

    document.getElementById("lightboxImage").src = src;
    document.getElementById("lightbox")
        .classList.remove("hidden");
}

function closeLightbox(){

    document.getElementById("lightbox")
        .classList.add("hidden");
}

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){
        closeLightbox();
    }
});

document.getElementById("lightbox")
?.addEventListener("click",(e)=>{

    if(e.target.id==="lightbox"){
        closeLightbox();
    }
});

    function downloadAll() {

    images.forEach((file, index) => {

        setTimeout(() => {

            const link = document.createElement("a");
            link.href = file;
            link.download = file;

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        }, index * 500);

    });

}

</script>

</body>
</html>
